<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AvatarHUD</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="hud-container">
    <!-- Clean Pure White Speech Bubble (antiy-zunda style) -->
    <div id="speech-bubble" class="speech-bubble show status-idle">
      <div class="bubble-header">
        <span class="status-badge" id="status-badge">
          <span class="status-indicator"></span>
          <span class="status-text" id="status-text">대기 중</span>
        </span>
        <span class="step-badge" id="step-badge" style="display: none;"></span>
        <span class="elapsed-badge" id="elapsed-time" style="display: none;"></span>
      </div>
      <div id="bubble-text" class="bubble-text">AvatarHUD 준비 완료!</div>
      <div class="bubble-arrow"></div>
    </div>

    <!-- Standing Avatar Character -->
    <div id="avatar-wrapper" class="pywebview-drag-region" title="드래그하여 이동 / 마우스 휠로 크기 조절 / 우클릭 시 설정">
      <img id="avatar-img" src="/static/default_avatar.png" alt="Avatar Standing" draggable="false">
      <div class="avatar-controls">
        <button id="btn-settings" title="환경설정 열기">SET</button>
        <button id="btn-change-avatar" title="캐릭터 이미지 변경">IMG</button>
        <button id="btn-scale-up" title="확대 (+)">+</button>
        <button id="btn-scale-down" title="축소 (-)">-</button>
      </div>
      <input type="file" id="avatar-file-input" accept="image/*,.png,.webp,.jpg,.jpeg,.gif,.bmp,.svg,.avif,.tiff,.tif,.ico" style="display: none;">
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
